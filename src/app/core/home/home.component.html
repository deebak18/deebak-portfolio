<section class="hero">
  <div class="hero-content">
    <div class="hero-text">
      <p class="greeting">Hi, I'm</p>
      <h1 class="hero-name">{{ name }}</h1>
      <h2 class="hero-title">{{ title }}</h2>
      <p class="hero-subtitle">{{ subtitle }}</p>
      <p class="hero-description">{{ description }}</p>
      
      <div class="hero-buttons">
        <a routerLink="/about" class="btn btn-primary">About Me</a>
        <a routerLink="/projects" class="btn btn-secondary">View Projects</a>
      </div>
      
      <div class="social-links">
        <a href="https://linkedin.com/in/deebak-p" target="_blank" class="social-link">LinkedIn</a>
        <a href="https://github.com/deebak-p" target="_blank" class="social-link">GitHub</a>
        <a href="mailto:deebakperumal@gmail.com" class="social-link">Email</a>
      </div>
    </div>
    
    <div class="hero-visual">
      <div class="code-block">
        <div class="code-line">
          <span class="code-keyword">const</span>
          <span class="code-variable"> developer</span>
          <span class="code-operator"> =</span>
          <span class="code-brace">{{ '{' }}</span>
        </div>
        <div class="code-line indent">
          <span class="code-property">name:</span>
          <span class="code-string">'{{ name }}'</span>
          <span class="code-comma">,</span>
        </div>
        <div class="code-line indent">
          <span class="code-property">role:</span>
          <span class="code-string">'{{ title }}'</span>
          <span class="code-comma">,</span>
        </div>
        <div class="code-line indent">
          <span class="code-property">skills:</span>
          <span class="code-brace">[</span>
          <span class="code-string">'Angular'</span>
          <span class="code-comma">,</span>
          <span class="code-string">'Spring Boot'</span>
          <span class="code-comma">,</span>
          <span class="code-string">'Microservices'</span>
          <span class="code-brace">]</span>
        </div>
        <div class="code-line">
          <span class="code-brace">{{ '}' }}</span>
          <span class="code-semicolon">;</span>
        </div>
      </div>
    </div>
  </div>
</section>
