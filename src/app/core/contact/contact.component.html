<section class="contact-section">
  <div class="container">
    <h2 class="section-title">Get In Touch</h2>
    <p class="section-subtitle">Let's work together on your next project</p>
    
    <div class="contact-content">
      <div class="contact-info">
        <div class="info-card">
          <div class="info-icon">📧</div>
          <h3>Email</h3>
          <a [href]="'mailto:' + contactInfo.email">{{ contactInfo.email }}</a>
        </div>
        
        <div class="info-card">
          <div class="info-icon">💼</div>
          <h3>LinkedIn</h3>
          <a [href]="'https://' + contactInfo.linkedin" target="_blank">{{ contactInfo.linkedin }}</a>
        </div>
        
        <div class="info-card">
          <div class="info-icon">💻</div>
          <h3>GitHub</h3>
          <a [href]="'https://' + contactInfo.github" target="_blank">{{ contactInfo.github }}</a>
        </div>
      </div>
      
      <form class="contact-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            [(ngModel)]="formData.name" 
            required
            placeholder="Your name"
          >
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="formData.email" 
            required
            placeholder="your.email@example.com"
          >
        </div>
        
        <div class="form-group">
          <label for="message">Message</label>
          <textarea 
            id="message" 
            name="message" 
            [(ngModel)]="formData.message" 
            required
            rows="5"
            placeholder="Your message here..."
          ></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </div>
</section>
