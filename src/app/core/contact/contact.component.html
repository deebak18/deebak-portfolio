<section class="contact-section">
  <div class="container">
    <h2 class="section-title">Get In Touch</h2>
    <p class="section-subtitle">Let's work together on your next project</p>
    
    <div class="contact-content">
      <div class="contact-info">
        <div class="info-card">
          <div class="info-icon">📧</div>
          <h3>Email</h3>
          <a [href]="'mailto:' + contactInfo.email">{{ contactInfo.email }}</a>
        </div>
        
        <div class="info-card">
          <div class="info-icon">💼</div>
          <h3>LinkedIn</h3>
          <a [href]="'https://' + contactInfo.linkedin" target="_blank">{{ contactInfo.linkedin }}</a>
        </div>
        
        <div class="info-card">
          <div class="info-icon">💻</div>
          <h3>GitHub</h3>
          <a [href]="'https://' + contactInfo.github" target="_blank">{{ contactInfo.github }}</a>
        </div>
        
        <div class="info-card resume-card">
          <div class="info-icon">📄</div>
          <h3>Resume</h3>
          <a (click)="downloadResume()" class="resume-download-link">Download Resume</a>
        </div>
      </div>
      

    </div>
  </div>
</section>
